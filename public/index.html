<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Strada</title>
  <link rel="icon" type="image/jpeg" href="static/assets/images/strada_logo.jpg" />
  <link rel="stylesheet" href="static/css/styles.css" />

</head>
<body>
  <!-- This is where the navbar is injected by app.js -->
  <header id="site-header"></header>

  <!-- This is where the page content is injected -->
  <main id="main-content"></main>

  <!-- This is your footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <!-- The 'id="year"' is critical for app.js -->
      <p>&copy; <span id="year"></span> Strada — Your trusted Vehicle Valuation Tool</p>
    </div>
  </footer>

  <!-- This script fills the <main> tag -->
  <script type="module" src="static/js/app.js"></script>
</body>
</html>
