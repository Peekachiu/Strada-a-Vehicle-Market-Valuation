name: 200 - Web Application Deployment

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Docker Image Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: peekachiu/strada-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: frontend/nginx/Dockerfile
          push: true
          tags: peekachiu/strada-frontend:latest

  deploy-infra:
    name: Terraform Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_REGION: ap-southeast-1 # Verify your region

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}


      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}


  deploy-migration:
    name: Database Schema Migration
    needs: deploy-infra
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Run Schema Migration via SSM
      shell: bash
      run: |
        echo ">>> Step 1: Locating Resources..."
        # Find ASG Name dynamically (ends with -api-asg)
        ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?contains(AutoScalingGroupName, '-api-asg')].AutoScalingGroupName" --output text | head -n 1)

        if [ -z "$ASG_NAME" ]; then
           echo "Error: Could not find ASG."
           exit 1
        fi
        echo "   ASG: $ASG_NAME"

        echo ">>> Step 2: Finding API Instance..."
        INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" --output text)

        if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
           echo "Error: No instances found in ASG!"
           exit 1
        fi
        echo "   Target Instance: $INSTANCE_ID"

        echo ">>> Step 3: Sending Migration Command..."
        
        # We only run 'migrate', NOT 'loaddata'
        CMD_RAW="docker_id=\$(sudo docker ps -q --filter ancestor=peekachiu/strada-backend:latest | head -n 1) && if [ -z \"\$docker_id\" ]; then echo 'Backend container not found!'; exit 1; fi && sudo docker exec \$docker_id python manage.py migrate"
        
        # Escape double quotes for JSON
        CMD_ESCAPED=${CMD_RAW//\"/\\\"}
        PARAMS_JSON="{\"commands\":[\"$CMD_ESCAPED\"]}"

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "$PARAMS_JSON" \
          --query "Command.CommandId" \
          --output text)

        echo "   Command Sent! ID: $COMMAND_ID"
        
        # Wait for command execution
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

        # Fetch output
        echo ">>> Output:"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
        
        # Fetch errors
        ERRORS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text)
        if [ ! -z "$ERRORS" ]; then
           echo ">>> Errors:"
           echo "$ERRORS"
           exit 1
        fi
        echo ">>> Migration Complete!"
