version: '3.8'

services:
  # Service 1: The Django Backend
  backend:
    build: .
    container_name: strada_backend
    volumes:
      - .:/app  # Syncs your code so you don't have to rebuild on every change
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1  # Keep debug on for development
    command: python manage.py runserver 0.0.0.0:8000 # Use dev server for now for auto-reload

  # Service 2: The Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: strada_nginx
    ports:
      - "80:80" # Maps localhost:80 to Nginx
    volumes:
      - ./public:/usr/share/nginx/html # Mount your frontend folder
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Mount config
      - ./static:/app/static # Mount static files (for admin)
    depends_on:
      - backend